window.saveToCloud = async function(data) {
  try {
    await db.collection('shukatsu').doc(DOC_ID).set(data);
  } catch(e) { console.error('cloud save error', e); }
};

window.loadFromCloud = async function() {
  try {
    const snap = await db.collection('shukatsu').doc(DOC_ID).get();
    if(snap.exists) return snap.data();
  } catch(e) { console.error('cloud load error', e); }
  return null;
};

window.startSync = function(callback) {
  db.collection('shukatsu').doc(DOC_ID).onSnapshot((snap) => {

  });
};

window.firebaseReady = true;

async function loadData(){
  // まずlocalStorageから読み込み（高速表示）
  try{const d=localStorage.getItem('sk6_entries');if(d)entries=JSON.parse(d);else entries=getInitEntries();}catch{entries=getInitEntries();}
  try{const d=localStorage.getItem('sk6_industries');if(d)industries=JSON.parse(d);}catch{}
  try{const d=localStorage.getItem('sk6_statuses');if(d)statuses=JSON.parse(d);}catch{}

  // クラウドから最新データを取得して上書き
  if(window.loadFromCloud){
    const cloud = await window.loadFromCloud();
    if(cloud){
      if(cloud.entries) entries=cloud.entries;
      if(cloud.industries) industries=cloud.industries;
      if(cloud.statuses) statuses=cloud.statuses;
      // localStorageも更新
      localStorage.setItem('sk6_entries',JSON.stringify(entries));
      localStorage.setItem('sk6_industries',JSON.stringify(industries));
      localStorage.setItem('sk6_statuses',JSON.stringify(statuses));
    }
  }
  // リアルタイム同期開始
  if(window.startSync){
    window.startSync((cloud)=>{
      if(cloud.entries) entries=cloud.entries;
      if(cloud.industries) industries=cloud.industries;
      if(cloud.statuses) statuses=cloud.statuses;
      localStorage.setItem('sk6_entries',JSON.stringify(entries));
      localStorage.setItem('sk6_industries',JSON.stringify(industries));
      localStorage.setItem('sk6_statuses',JSON.stringify(statuses));
      populateFilters();renderTable();
    });
  }
}
function saveData(){
  try{localStorage.setItem('sk6_entries',JSON.stringify(entries));}catch{}
  try{localStorage.setItem('sk6_industries',JSON.stringify(industries));}catch{}
  try{localStorage.setItem('sk6_statuses',JSON.stringify(statuses));}catch{}
  // クラウド同期
  if(window.saveToCloud){
    window.saveToCloud({entries, industries, statuses});
  }
}
function nextId(){return entries.length?Math.max(...entries.map(e=>e.id||0))+1:0;}

function switchTab(t){
  const names=['list','calendar','settings'];
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',names[i]===t));
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='calendar')renderCalendar();
  if(t==='settings')renderSettings();
}

function renderSummary(){
  const cards=[
    {l:'企業数',v:entries.length,c:'cp'},
    {l:'説明会',v:entries.filter(e=>e.setsumeikai).length,c:'ct'},
    {l:'インターン',v:entries.filter(e=>e.internPeriods&&e.internPeriods.length>0).length,c:'ca'},
    {l:'内定',v:entries.filter(e=>e.status==='内定').length,c:'cc'},
  ];
  document.getElementById('summary-cards').innerHTML=cards.map(c=>`<div class="s-card ${c.c}"><div class="lbl">${c.l}</div><div class="val">${c.v}</div></div>`).join('');
}

function populateFilters(){
  const fs=document.getElementById('filter-status'),sv=fs.value;
  fs.innerHTML='<option value="">すべてのステータス</option>'+statuses.map(s=>`<option value="${s}">${s}</option>`).join('');
  if(sv)fs.value=sv;
  const fi=document.getElementById('filter-industry'),iv=fi.value;
  fi.innerHTML='<option value="">業界すべて</option>'+industries.map(i=>`<option value="${i}">${i}</option>`).join('');
  if(iv)fi.value=iv;
}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const fs=document.getElementById('filter-status').value;
  const fi=document.getElementById('filter-industry').value;
  const filtered=entries.filter(e=>{
    const mq=!q||e.name.toLowerCase().includes(q)||(e.industry||'').toLowerCase().includes(q);
    return mq&&(!fs||e.status===fs)&&(!fi||e.industry===fi);
  });
  const tbody=document.getElementById('tbl-body');
  tbody.innerHTML='';
  filtered.forEach(e=>{
    const tr=document.createElement('tr');
    tr.className='row-click'+(currentId===e.id?' active-row':'');
    const bs=getBadgeStyle(statuses,e.status);
    const mpUrls=(e.mypageUrls||[]).filter(u=>u&&u.startsWith('http'));
    const mpCell=mpUrls.length?mpUrls.map((u,i)=>'<a href="'+u+'" target="_blank" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:11px;background:#EEEDFE;color:#3C3489;border:1px solid #AFA9EC;text-decoration:none;margin:1px">🔗'+(mpUrls.length>1?i+1:'')+'</a>').join(''):'—';
    const dlHtml=e.internDeadline?`<span class="${daysUntil(e.internDeadline)!==null&&daysUntil(e.internDeadline)<=7?'dl-near':''}">${fmtD(e.internDeadline)}</span>`:'—';
    const honDl=e.honDeadline?fmtD(e.honDeadline):'—';
    tr.innerHTML=`
      <td><div class="cell-view" style="font-weight:600">${e.name}</div></td>
      <td><div class="cell-view" style="color:#666">${e.industry||'—'}</div></td>
      <td><div class="cell-view" style="color:#666">${fmtSalary(e.salary)}</div></td>
      <td><div class="cell-view star-cell">${'★'.repeat(e.star||0)}</div></td>
      <td><div class="cell-view"><span class="badge" style="${bs}">${e.status}</span></div></td>
      <td><div class="cell-view">${dlHtml}</div></td>
      <td><div class="cell-view" style="color:#A32D2D;font-weight:${e.honDeadline?'600':'400'}">${honDl}</div></td>
      <td><div class="cell-view">${(e.mypageUrls&&e.mypageUrls.filter(u=>u&&u.startsWith('http')).length)?e.mypageUrls.filter(u=>u&&u.startsWith('http')).map((u,i)=>`<a href="${u}" target="_blank" style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:11px;background:#EEEDFE;color:#3C3489;border:1px solid #AFA9EC;text-decoration:none;margin:1px" onclick="event.stopPropagation()">🔗${e.mypageUrls.filter(u=>u&&u.startsWith('http')).length>1?i+1:''}</a>`).join(''):'—'}</div></td>
    `;
    tr.addEventListener('click',()=>openDetail(e.id));
    tbody.appendChild(tr);
  });
  renderSummary();
}

// ---- DETAIL PANE ----
function openDetail(id){
  currentId=id;
  const e=entries.find(x=>x.id===id);
  if(!e)return;
  document.getElementById('detail-pane').classList.remove('closed');
  document.querySelectorAll('#tbl-body tr').forEach(tr=>tr.classList.remove('active-row'));
  event&&event.currentTarget&&event.currentTarget.classList.add('active-row');
  renderDetail(e);
  // re-highlight
  document.querySelectorAll('#tbl-body tr').forEach(tr=>{
    const cells=tr.querySelectorAll('.cell-view');
    if(cells.length&&cells[0].textContent.trim()===e.name)tr.classList.add('active-row');
  });
}

function closeDetail(){
  document.getElementById('detail-pane').classList.add('closed');
  document.querySelectorAll('#tbl-body tr').forEach(tr=>tr.classList.remove('active-row'));
  currentId=null;
}

  // ---- メモ ----

}

function getVal(id){const el=document.getElementById('dp_'+id);return el?el.value:'';} 
let _autoSaveTimer=null;
function autoSave(){
  clearTimeout(_autoSaveTimer);
  const ind=document.getElementById('autosave-indicator');
  if(ind)ind.textContent='保存中...';
  _autoSaveTimer=setTimeout(()=>{
    saveDetail();
    if(ind)ind.textContent='✓ 保存済み';
    setTimeout(()=>{if(ind)ind.textContent='';},2000);
  },600);
}
function wireAutoSave(){
  const body=document.getElementById('dp-body');
  if(!body)return;
  body.querySelectorAll('input,select,textarea').forEach(el=>{
    el.addEventListener('input',autoSave);
    el.addEventListener('change',autoSave);
  });
  // MutationObserver to wire newly added rows (intern periods, interviews, etc)
  if(window._dpObserver)window._dpObserver.disconnect();
  window._dpObserver=new MutationObserver(()=>{
    body.querySelectorAll('input,select,textarea').forEach(el=>{
      if(!el.dataset.wired){el.dataset.wired='1';el.addEventListener('input',autoSave);el.addEventListener('change',autoSave);}
    });
  });
  window._dpObserver.observe(body,{childList:true,subtree:true});
}
function saveDetail(){
  if(currentId===null)return;
  const idx=entries.findIndex(x=>x.id===currentId);
  if(idx<0)return;
  const e=entries[idx];
  e.name=getVal('name');
  e.industry=getVal('industry')==='—'?'':getVal('industry');
  e.salary=parseInt(getVal('salary'))||0;
  e.location=getVal('location');
  e.jobType=getVal('jobType');
  e.star=[...document.querySelectorAll('.star-btn')].filter(b=>b.classList.contains('on')).length;
  e.status=getVal('status');
  e.processStep=[...document.querySelectorAll('.pstep')].find(p=>p.classList.contains('current'))?.dataset.step||'';
  e.internPeriods=[...document.querySelectorAll('#dp_intern_periods .period-block')].map(b=>({
    label:b.querySelector('.period-lbl-inp').value.trim(),
    start:b.querySelector('.period-start').value,
    end:b.querySelector('.period-end').value,
  })).filter(p=>p.start);
  e.internDeadline=getVal('internDeadline');
  e.internUrls=[...document.querySelectorAll('#dp_internUrls input[type=url]')].map(i=>i.value.trim()).filter(v=>v);
  e.esDeadline=getVal('esDeadline');
  e.honDeadline=getVal('honDeadline');
  e.interviews=[...document.querySelectorAll('#dp_interviews .period-block')].map(b=>({
    date:b.querySelector('.iv-date').value,
    type:b.querySelector('.iv-type').value,
    memo:b.querySelector('.iv-memo').value,
  })).filter(v=>v.date);
  e.internalDeadline=getVal('internalDeadline');
  e.examType=getVal('examType');
  e.mypageUrls=[...document.querySelectorAll('#dp_mypageUrls input[type=url]')].map(i=>i.value.trim()).filter(v=>v);
  e.loginId=getVal('loginId');
  e.loginPw=document.getElementById('dp_loginPw').value;
  e.obvisit=[...document.querySelectorAll('#dp_obvisit .period-block')].map(b=>({
    date:b.querySelector('.ob-date').value,
    memo:b.querySelector('.ob-memo').value,
  })).filter(v=>v.date);
  e.setsumeikai=getVal('setsumeikai');
  e.memo=getVal('memo');
  entries[idx]=e;
  saveData();
  document.getElementById('dp-name-display').textContent=e.name;
  const bs=getBadgeStyle(statuses,e.status);
  document.getElementById('dp-status-badge').innerHTML=`<span class="badge" style="${bs}">${e.status}</span>`;
  populateFilters();renderTable();
  // re-highlight active row after re-render
  document.querySelectorAll('#tbl-body tr').forEach(tr=>{
    const c=tr.querySelector('.cell-view');if(c&&c.textContent.trim()===e.name)tr.classList.add('active-row');
  });
}

function openNewEntry(){
  const newE={id:nextId(),name:'新しい企業',industry:'',salary:0,status:statuses[0]||'応募前',star:0,
    setsumeikai:'',internPeriods:[],internDeadline:'',internUrls:[],
    esDeadline:'',honDeadline:'',interviews:[],internalDeadline:'',
    location:'',jobType:'',examType:'',
    mypageUrls:[],loginId:'',loginPw:'',obvisit:[],memo:'',processStep:''};
  entries.push(newE);saveData();populateFilters();renderTable();
  openDetail(newE.id);
}

function deleteCurrentEntry(){
  if(currentId===null)return;
  const e=entries.find(x=>x.id===currentId);
  if(!confirm((e?e.name:'この企業')+'を削除しますか？'))return;
  entries=entries.filter(x=>x.id!==currentId);
  saveData();closeDetail();populateFilters();renderTable();
}

// ---- SETTINGS ----
function renderSettings(){
  document.getElementById('industry-tags').innerHTML=industries.map((ind,i)=>
    `<span class="tag-item">${ind}<span class="tag-del" onclick="removeIndustry(${i})">×</span></span>`).join('');
  document.getElementById('status-tags').innerHTML=statuses.map((s,i)=>{
    const st=getBadgeStyle(statuses,s);
    return`<span class="tag-item" style="${st}">${s}<span class="tag-del" onclick="removeStatus(${i})">×</span></span>`;
  }).join('');
}
function addIndustry(){const v=document.getElementById('new-industry').value.trim();if(!v||industries.includes(v))return;industries.push(v);document.getElementById('new-industry').value='';saveData();renderSettings();populateFilters();}
function removeIndustry(i){industries.splice(i,1);saveData();renderSettings();populateFilters();}
function addStatus(){const v=document.getElementById('new-status').value.trim();if(!v||statuses.includes(v))return;statuses.push(v);document.getElementById('new-status').value='';saveData();renderSettings();populateFilters();}
function removeStatus(i){statuses.splice(i,1);saveData();renderSettings();populateFilters();}

// ---- CALENDAR ----
function changeMonth(d){calMonth+=d;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function dateRange(start,end){
  const dates=[];const s=new Date(start);const e=end?new Date(end):new Date(start);
  for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))dates.push(new Date(d).toISOString().slice(0,10));
  return dates;
}
function renderCalendar(){
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-title').textContent=calYear+'年 '+months[calMonth];
  document.getElementById('cal-day-labels').innerHTML=['日','月','火','水','木','金','土'].map(d=>`<div class="cal-dl">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const last=new Date(calYear,calMonth+1,0).getDate();
  const prevLast=new Date(calYear,calMonth,0).getDate();
  const evts={};
  const addEv=(ds,name,type)=>{
    if(!ds)return;
    const dt=new Date(ds);
    if(dt.getFullYear()===calYear&&dt.getMonth()===calMonth){
      const k=dt.getDate();if(!evts[k])evts[k]=[];evts[k].push({name,type});
    }
  };
  entries.forEach(e=>{
    addEv(e.setsumeikai,e.name,'setsu');
    (e.internPeriods||[]).forEach(p=>{
      const lbl=p.label?'('+p.label+')':'';
      dateRange(p.start,p.end).forEach(d=>addEv(d,e.name+lbl,'intern'));
    });
    addEv(e.internDeadline,e.name,'dl');
    addEv(e.esDeadline,e.name+' ES','dl');
    addEv(e.honDeadline,e.name+' 本選考','hondl');
    addEv(e.internalDeadline,e.name+' 承諾','hondl');
    (e.interviews||[]).forEach(iv=>addEv(iv.date,e.name+(iv.type?' '+iv.type+'面接':''),'interview'));
  });
  const todayD=now.getDate(),todayM=now.getMonth(),todayY=now.getFullYear();
  let total=first+last;total+=((7-total%7)%7);
  let html='';
  const typeClass={setsu:'ev-setsu',intern:'ev-intern',dl:'ev-dl',interview:'ev-interview',hondl:'ev-hondl'};
  const typeLabel={setsu:'説',intern:'イン',dl:'締',interview:'面',hondl:'本締'};
  for(let i=0;i<total;i++){
    let date,isOther=false;const dow=i%7;
    if(i<first){date=prevLast-first+1+i;isOther=true;}
    else if(i>=first+last){date=i-first-last+1;isOther=true;}
    else{date=i-first+1;}
    const isToday=!isOther&&date===todayD&&calMonth===todayM&&calYear===todayY;
    const evList=(!isOther&&evts[date])||[];
    const dowCls=dow===0?' sun':dow===6?' sat':'';
    html+=`<div class="cal-cell${isOther?' other':''}${isToday?' today':''}${dowCls}">
      <div class="cal-date">${date}</div>
      ${evList.slice(0,3).map(ev=>`<div class="cal-ev ${typeClass[ev.type]||''}">${typeLabel[ev.type]||''} ${ev.name}</div>`).join('')}
      ${evList.length>3?`<div style="font-size:10px;color:#aaa">+${evList.length-3}件</div>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}
